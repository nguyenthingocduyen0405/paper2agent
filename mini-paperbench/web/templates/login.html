{% extends "base.html" %}
{% block title %}로그인 - PaperAgent{% endblock %}
{% block content %}
<div class="narrow">
  <h1>로그인</h1>
  <p class="sub">계정은 관리자가 만들어 드립니다.</p>
  {% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="card form">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label class="title" for="username">아이디</label>
      <input type="text" name="username" id="username" value="{{ username }}" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label class="title" for="password">비밀번호</label>
      <input type="password" name="password" id="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">로그인</button>
  </form>
</div>
{% endblock %}
