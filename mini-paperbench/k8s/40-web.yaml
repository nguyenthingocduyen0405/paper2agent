# 웹: 논문을 받아 작업을 만들고, Job(에이전트, 작업 생성, 집계)을 차례로 띄우고, 결과를 보여 준다.
# Job을 만들고 judge 워커의 RUN_ID를 바꾸므로 ServiceAccount에 그 권한만 준다.
# 접속: NodePort 30080. 보안 그룹은 열지 않고 SSH 터널로 연다.
#   ssh -i paperagent.pem -L 8080:localhost:30080 ubuntu@<EC2 IP>  →  http://localhost:8080
# 저장: 작업·사용자·결과는 RDS PostgreSQL(DATABASE_URL, Secret web-secrets), 파일은 /data와 S3(S3_BUCKET).
#   S3와 RDS 시작/정지 권한은 EC2에 붙인 LabRole에서 온다(메타데이터 서비스). 이 Pod만 메타데이터에 갈 수 있다(45-network.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: paperbench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web
  namespace: paperbench
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["judge-worker"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web
  namespace: paperbench
subjects:
  - kind: ServiceAccount
    name: web
    namespace: paperbench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: paperbench
spec:
  replicas: 1   # 작업 진행 루프가 웹 안에 있으므로 1개만 둔다
  strategy:
    type: Recreate   # 새 버전을 띄울 때도 옛 Pod를 먼저 내린다(작업 진행 루프가 두 개 겹치지 않게)
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      serviceAccountName: web
      containers:
        - name: web
          image: paperbench/web:__TAG__
          imagePullPolicy: Never   # 이미지는 bootstrap.sh가 k3s에 직접 넣는다
          ports:
            - containerPort: 8000
          env:
            - name: IMAGE_TAG          # 웹이 만드는 Job도 같은 태그의 이미지를 쓴다
              value: "__TAG__"
            - name: MAX_AGENT_JOBS     # 동시에 돌리는 에이전트(코드 작성) Job 수
              value: "1"
            - name: S3_BUCKET          # 비우면 S3를 쓰지 않는다
              value: "__S3_BUCKET__"
            - name: AWS_REGION
              value: "us-east-1"
          envFrom:
            - configMapRef: {name: llm-config}   # REDIS_URL, LLM_MODEL
            # DATABASE_URL, ADMIN_USERNAME, ADMIN_PASSWORD, SERVICE_TOKEN (bootstrap.sh가 .env에서 만든다)
            - secretRef: {name: web-secrets, optional: true}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: results, mountPath: /app/results}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 768Mi}
      volumes:
        - name: data
          hostPath: {path: /data, type: DirectoryOrCreate}
        - name: results
          hostPath: {path: /data/results, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: paperbench
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
