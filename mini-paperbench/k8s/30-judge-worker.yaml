# judge 워커. 기본은 공용 multi-run 스트림(pb:global:tasks)에서 여러 작업을 재시작 없이 동시에 처리한다.
# scripts/k8s_run.sh나 벤치마크처럼 단일 run을 지정할 때는 RUN_ID=<run>으로 바꿀 수 있다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-worker
  namespace: paperbench
spec:
  replicas: 4
  selector:
    matchLabels: {app: judge-worker}
  template:
    metadata:
      labels: {app: judge-worker}
    spec:
      containers:
        - name: worker
          image: paperbench/judge-worker:__TAG__
          imagePullPolicy: Never   # 이미지는 bootstrap.sh가 k3s에 직접 넣는다
          command: ["python", "-m", "judge.worker"]
          env:
            - name: RUN_ID
              value: "multi"
          envFrom:
            - configMapRef: {name: llm-config}
            - secretRef: {name: llm-keys}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: results, mountPath: /app/results}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
      volumes:
        - name: data
          hostPath: {path: /data, type: DirectoryOrCreate}
        - name: results
          hostPath: {path: /data/results, type: DirectoryOrCreate}
