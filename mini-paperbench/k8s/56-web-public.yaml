# 고정 공개 주소: VM의 80번 포트를 웹으로 보낸다(k3s 기본 ServiceLB).
# 학교 jcloud VM은 NAT가 바깥의 정해진 포트를 이 VM의 80번으로 넘긴다.
# bootstrap.sh가 .env의 PUBLIC_URL이 http://로 시작할 때만 적용한다. https 주소(AWS Elastic IP)는 57-caddy.yaml이 맡는다.
apiVersion: v1
kind: Service
metadata:
  name: web-public
  namespace: paperbench
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8000
