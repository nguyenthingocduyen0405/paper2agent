# Job 템플릿: 논문 준비(PDF → markdown, 채점 기준 자동 생성). 에이전트 이미지를 쓴다.
# 웹(web/orchestrator.py)이 __NAME__, __TAG__, __ARGS__를 채워서 만든다.
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: paperbench
spec:
  backoffLimit: 0   # 실패 이유(스캔본, 너무 긴 논문 등)는 다시 해도 같다. LLM 일시 오류는 agent/llm.py가 재시도한다
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prepare
          image: paperbench/agent:__TAG__
          imagePullPolicy: Never
          command: ["python", "-m", "agent.prepare"]
          args: __ARGS__
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}   # 큰 PDF 변환에도 남는다. 넘으면 이 Pod만 끝나고 노드는 버틴다
          envFrom:
            - configMapRef: {name: llm-config}
            - secretRef: {name: llm-keys}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          hostPath: {path: /data, type: DirectoryOrCreate}
