name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-paperbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mini-paperbench/requirements.txt
            mini-paperbench/web/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r web/requirements.txt pytest httpx fakeredis

      - name: Syntax and manifest check
        run: |
          python -m compileall -q web judge agent hermes claude-bridge
          python -c "import pathlib, yaml; [list(yaml.safe_load_all(p.read_text(encoding='utf-8'))) for p in pathlib.Path('k8s').rglob('*.yaml')]; print('k8s YAML OK')"
          for f in scripts/*.sh; do bash -n "$f" || exit 1; done   # bash -n은 첫 파일만 검사하므로 하나씩

      - name: Run unit tests
        run: pytest -v
